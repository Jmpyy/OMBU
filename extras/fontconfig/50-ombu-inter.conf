<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ombu: Inter como letra de la interfaz (la de Linear, Figma y tantas apps modernas). La toman ombu
     (Quickshell), Dolphin y las apps GTK, que piden «sans-serif». Si Inter no está instalada
     (sudo pacman -S inter-font), sigue Noto Sans: instalar esto antes no cambia nada.
     Va en ~/.config/fontconfig/conf.d/ -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
