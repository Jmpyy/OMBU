# kitty con el estilo de ombu. Los colores están en themes/ombu.conf.
include themes/ombu.conf

# Fuente: Nerd Font con íconos
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Ventana: fondo sólido, como el resto de ombu
background_opacity     1.0
window_padding_width   16
hide_window_decorations yes
cursor_trail           1
scrollback_lines       10000
copy_on_select         clipboard
mouse_hide_wait        3
url_style              curly

# Pestañas: solo se ven cuando hay más de una
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    round
tab_bar_min_tabs       2
tab_title_template     " {index} · {title} "

# Divisiones dentro de una misma ventana
enabled_layouts        splits:split_axis=horizontal,stack
map ctrl+shift+enter     launch --location=split --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+shift+z         toggle_layout stack
map alt+left             neighboring_window left
map alt+right            neighboring_window right
map alt+up               neighboring_window up
map alt+down             neighboring_window down
map ctrl+shift+t         new_tab_with_cwd

# Avisa cuando un comando largo (30 s o más) termina y esa terminal no está a la vista
notify_on_cmd_finish   invisible 30
