# Prompt con el estilo de ombu: minimalista, una línea de contexto y la flecha.
add_newline = false
palette = "ombu"
format = """$directory$git_branch$git_status$cmd_duration
$character"""

[palettes.ombu]
accent = "#a78bfa"
dim = "#8a8a9c"
danger = "#f87171"
warn = "#fbbf24"

[directory]
style = "bold accent"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "dim"
format = "[$symbol$branch]($style) "

[git_status]
style = "warn"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 4000
style = "dim"
format = "[󰔛 $duration]($style) "

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold danger)"
